[package]
name = "seed-rest-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
worker = "0.8"
worker-macros = "0.8"
getrandom = { version = "0.3", features = ["wasm_js"] }
rand = "0.9"

[profile.release]
lto = true
# `strip = true` removes wasm `target_features` that wasm-bindgen needs
# (https://github.com/cloudflare/workers-rs/issues/1014)
strip = "debuginfo"
codegen-units = 1
